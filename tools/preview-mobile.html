<!doctype html><meta charset="utf-8"><title>Vista móvil</title>
<style>body{margin:0;background:#333;display:flex;gap:10px;padding:6px;height:100vh;box-sizing:border-box}iframe{width:390px;height:100%;border:0;flex:none;background:#000}</style>
<iframe src="../index.html"></iframe><iframe src="../index.html"></iframe><iframe src="../index.html"></iframe>
<script>
window.at=function(sels){[].forEach.call(document.querySelectorAll('iframe'),function(f,i){var w=f.contentWindow,s=sels[i];if(s==null)return;if(typeof s==='number'){w.scrollTo(0,s);return}var p=s.split('|'),e=w.document.querySelector(p[0]);w.scrollTo(0,e.getBoundingClientRect().top+w.pageYOffset+(+p[1]||0))});return 'ok'};
</script>
