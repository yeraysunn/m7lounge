<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M7 Lounge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d0f;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 480px; }
    h1 { font-size: clamp(48px, 12vw, 88px); letter-spacing: -2px; font-weight: 800; }
    .tag { color: #b8a06a; letter-spacing: 4px; text-transform: uppercase; font-size: 13px; margin-top: 8px; }
    .info { margin-top: 40px; line-height: 1.9; color: #a0a0a8; font-size: 15px; }
    .cta {
      display: inline-block;
      margin-top: 32px;
      padding: 14px 32px;
      background: #b8a06a;
      color: #0d0d0f;
      text-decoration: none;
      font-weight: 600;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>M7</h1>
    <div class="tag">Lounge</div>
    <div class="info">
      Shisha &amp; Cocktails<br>
      C/ Major 7, Salou<br>
      Martes a domingo · 17:00 – 03:00
    </div>
    <a class="cta" href="https://instagram.com/m7_lounge">Instagram</a>
  </div>
</body>
</html>
